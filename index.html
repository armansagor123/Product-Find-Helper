<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Support Helper</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1c1e21;--muted:#65676b;--accent:#1877f2;--line:#dddfe2;--danger:#d93025}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--accent:#4599ff;--line:#3e4042;--danger:#ff6b60}}
:root[data-theme="dark"]{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--accent:#4599ff;--line:#3e4042;--danger:#ff6b60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali","Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:8px 12px;border-radius:8px;cursor:pointer}
button.primary,button.on{background:var(--accent);color:#fff}
button.del{border-color:var(--danger);color:var(--danger)}
button.del.sure{background:var(--danger);color:#fff}
input,textarea,select{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:150px;resize:vertical}
textarea.s{min-height:70px}
label{font-size:.8rem;color:var(--muted);display:block;margin:8px 0 2px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.g .w{grid-column:1/-1}
.srow{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:10px}
.srow button{margin-top:8px;font-size:.85rem;padding:5px 10px}
.age{display:flex;gap:8px;margin-top:10px}
.age input{max-width:150px}
summary{cursor:pointer;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 4px}
.prod{display:flex;gap:8px}.prod select{flex:1}
#pic{display:block;max-width:100%;max-height:420px;margin:0 auto 10px;border-radius:10px}
.nopic{color:var(--muted);text-align:center;padding:18px 0;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:8px 16px;border-radius:20px;font-size:.9rem;display:none;max-width:90%;z-index:20}
</style>
</head>
<body>
<main>
<h1>Product Support Helper</h1>
<p class="sub">Product select korun, tarpor button chapen. Reply copy kore Messenger e paste korun.</p>

<div class="card">
  <label style="margin-top:0">Product</label>
  <div class="prod">
    <select id="psel" onchange="selProd(this.value)"></select>
    <button class="primary" onclick="addProd()">+ Notun</button>
  </div>
</div>

<div class="card">
  <div class="seg">
    <button id="gM" onclick="setG('M')">👦 Male</button>
    <button id="gF" onclick="setG('F')">👧 Female</button>
    <button id="gC" onclick="setG('C')">📏 Size chart</button>
  </div>
</div>

<div class="card">
  <img id="pic" alt="" style="display:none">
  <div id="nopic" class="nopic">Ei option er jonne kono photo nai</div>
  <div class="row">
    <button class="primary" onclick="document.getElementById('file').click()">📷 Photo din</button>
    <button onclick="copyPic()" id="cpBtn">Photo copy</button>
    <button onclick="dlPic()">Download</button>
    <button onclick="rmPic()">Muche din</button>
  </div>
  <input id="file" type="file" accept="image/*" style="display:none" onchange="loadPic(this)">
</div>

<div class="card">
  <div class="row">
    <button onclick="priceReply()">Dam koto?</button>
    <button onclick="sizeReply()">Size gulo ki ki?</button>
  </div>
  <div class="age">
    <input id="age" type="number" min="0" step="0.5" placeholder="Boyosh (bochor)">
    <button onclick="ageReply()">Boyosh diye size</button>
  </div>
  <div class="age">
    <input id="chest" type="number" min="0" step="0.5" placeholder="Chest (inch)">
    <button onclick="chestReply()">Chest diye size</button>
  </div>
</div>

<div class="card">
  <label for="out" style="margin-top:0">Reply (cahile edit korte paren)</label>
  <textarea id="out" placeholder="Ekhane reply ashbe..."></textarea>
  <div class="row" style="margin-top:8px">
    <button class="primary" onclick="copyOut()" id="copyBtn">Copy</button>
    <button onclick="document.getElementById('out').value=''">Clear</button>
  </div>
</div>

<details class="card" id="set">
  <summary>Settings (ei product er info bodlan)</summary>
  <label>Product er naam</label><input id="pname" oninput="cur().name=this.value;sched()" onchange="renderSel()">
  <label>Delivery charge (taka, na thakle 0)</label><input id="pdel" type="number" oninput="cur().delivery=+this.value;sched()">
  <label>Extra note (protiti reply te jabe)</label><textarea id="pnote" class="s" oninput="cur().note=this.value;sched()"></textarea>
  <div id="rows"></div>
  <div class="row" style="margin-top:12px">
    <button onclick="addSize()">+ Size add</button>
    <button class="primary" onclick="saveCfg()">Save</button>
    <button class="del" id="delBtn" onclick="delProd()">Ei product muche din</button>
  </div>
</details>
</main>
<div id="toast"></div>

function migrate(p){

function $(i){return document.getElementById(i)}
function cur(){return data.products.filter(function(p){return p.id===data.cur})[0]||data.products[0]}

function loadPic(inp){
  var fl=inp.files&&inp.files[0];if(!fl)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var m=g==="C"?1000:700,sc=Math.min(1,m/Math.max(im.width,im.height));
      var c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cur().pics[g]=c.toDataURL("image/jpeg",0.85);
      persist();showPic();
    };
    im.src=r.result;
  };
  r.readAsDataURL(fl);inp.value="";
}
function rmPic(){cur().pics[g]="";persist();showPic();}
function dlPic(){
  var d=cur().pics[g];if(!d){toast("Age photo din");return;}
  var a=document.createElement("a");a.href=d;a.download=cur().name+"-"+g+".jpg";a.click();
}
function toPng(b){
  return new Promise(function(res){
    var im=new Image();im.onload=function(){
      var c=document.createElement("canvas");c.width=im.width;c.height=im.height;
      c.getContext("2d").drawImage(im,0,0);c.toBlob(res,"image/png");
    };im.src=URL.createObjectURL(b);
  });
}
function copyPic(){
  var d=cur().pics[g];if(!d){toast("Age photo din");return;}
  fetch(d).then(function(r){return r.blob()}).then(function(b){
    return navigator.clipboard.write([new ClipboardItem({"image/png":toPng(b)})]);
  }).then(function(){flash("cpBtn","Copied ✓","Photo copy");})
  .catch(function(){toast("Copy hoyni. Download chepe pathan.");});
}

function chestTxt(z){
  if(z.c1===""||z.c1==null)return "";
  return (z.c2===""||z.c2==null||z.c2===z.c1)?z.c1+" ইঞ্চি":z.c1+"-"+z.c2+" ইঞ্চি";
}
function line(z){
  var parts=[],at=z.a1+"-"+z.a2;
  if(z.a1!==""&&z.a2!==""&&z.l.indexOf(at)<0)parts.push("বয়স "+at+" বছর");
  if(chestTxt(z))parts.push("বুক "+chestTxt(z));
  return z.l+(parts.length?" – "+parts.join(", "):"");
}
function dlv(p){return p.delivery>0?"\nডেলিভারি চার্জ "+p.delivery+" টাকা।":""}
function tail(p){return p.note?"\n"+p.note:""}
function uniq(p){return p.sizes.map(function(z){return z.p}).filter(function(v,i,a){return a.indexOf(v)===i});}
var ORD="\nঅর্ডার করতে চাইলে আপনার নাম, ঠিকানা ও ফোন নম্বর দিন।";

function priceReply(){
  var p=cur(),u=uniq(p),t;
  if(u.length===1)t=pn()+" এর দাম "+u[0]+" টাকা।";
  else t=pn()+" এর দাম সাইজ অনুযায়ী:\n"+p.sizes.map(function(z){return "• "+line(z)+" – "+z.p+" টাকা"}).join("\n");
  $("out").value="আসসালামু আলাইকুম! 😊\n"+t+dlv(p)+tail(p)+ORD;
}
function sizeReply(){
  var p=cur(),multi=uniq(p).length>1;
  var t=pn()+" এ "+p.sizes.length+"টি সাইজ আছে:\n"+p.sizes.map(function(z){return "• "+line(z)+(multi?" – "+z.p+" টাকা":"")}).join("\n");
  if(!multi)t+="\nদাম "+p.sizes[0].p+" টাকা।";
  $("out").value=t+"\nবয়স বা বুকের মাপ জানালে সঠিক সাইজ বলে দিতে পারব। 😊"+tail(p);
}
function ageReply(){
  var p=cur(),age=parseFloat($("age").value);
  if(isNaN(age)){toast("Boyosh likhun");return;}
  var s=p.sizes,z=s.filter(function(x){return x.a1!==""&&age>=x.a1&&age<x.a2})[0]||s.filter(function(x){return x.a1!==""&&age>=x.a1&&age<=x.a2})[0];
  if(!z){$("out").value="এই বয়সের জন্য আমাদের সাইজ এখন নেই। বাচ্চার বুকের মাপ জানালে দেখে বলতে পারব কোনটা কাছাকাছি হবে।";return;}
  $("out").value="বয়স "+age+" বছর হলে "+pn()+" এর "+z.l+" সাইজটি ঠিক হবে। 😊"+(chestTxt(z)?"\nবুকের মাপ: "+chestTxt(z):"")+(z.n?"\n"+z.n:"")+"\nদাম "+z.p+" টাকা।"+dlv(p)+tail(p)+"\nসঠিক সাইজের জন্য বাচ্চার বুকের মাপ জানাবেন।"+ORD;
}
function chestReply(){
  var p=cur(),c=parseFloat($("chest").value);
  if(isNaN(c)){toast("Chest likhun");return;}
  var s=p.sizes.filter(function(z){return z.c1!==""&&z.c1!=null});
  if(!s.length){toast("Ei product e chest size deya nai");return;}
  function hi(z){return (z.c2===""||z.c2==null)?z.c1:z.c2}
  var z=s.filter(function(x){return c>=x.c1&&c<=hi(x)})[0]||s.filter(function(x){return hi(x)>=c})[0],big=false;
  if(!z){z=s[s.length-1];big=true;}
  var head=big?"বুকের মাপ "+c+" ইঞ্চি আমাদের সবচেয়ে বড় সাইজের ("+chestTxt(z)+") চেয়েও বেশি। কাছাকাছি সাইজ "+z.l+"।":"বুকের মাপ "+c+" ইঞ্চি হলে "+pn()+" এর "+z.l+" সাইজটি ঠিক হবে। 😊";
  $("out").value=head+"\nবুকের মাপ: "+chestTxt(z)+(z.n?"\n"+z.n:"")+"\nদাম "+z.p+" টাকা।"+dlv(p)+tail(p)+ORD;
}
function copyOut(){
  var o=$("out");o.select();
  try{navigator.clipboard.writeText(o.value);}catch(e){document.execCommand("copy");}
  flash("copyBtn","Copied ✓","Copy");
}
renderSel();fillSettings();setG("M");persist();
</script>
</body>
